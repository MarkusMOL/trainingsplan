<body>
  <div id="app"><p class="boot">Lade Trainingsplan …</p></div>
  <noscript><p class="boot">Diese App benötigt JavaScript.</p></noscript>
  <script>
    // Browser blockieren ES-Module und fetch() bei file:// – dann hilft nur ein Webserver oder standalone.html.
    if (location.protocol === 'file:') {
      document.querySelector('.boot').textContent =
        'Diese Seite wurde direkt als Datei geöffnet. Das blockiert der Browser. ' +
        'Bitte standalone.html öffnen oder die App über einen Webserver starten (siehe README.md).';
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
